<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
    <!-- Background Gradient -->
    <rect width="1200" height="400" rx="12" fill="url(#bg-gradient)"/>

    <!-- Accent Top Right Pattern -->
    <circle cx="1100" cy="80" r="180" fill="#38BDF8" opacity="0.05"/>
    <circle cx="1050" cy="120" r="100" fill="#38BDF8" opacity="0.08"/>

    <!-- Badge Tag -->
    <rect x="60" y="45" width="290" height="32" rx="16" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.3"/>
    <text x="75" y="66" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">DATA ANALYTICS PORTFOLIO</text>

    <!-- Main Title -->
    <text x="60" y="130" fill="#FFFFFF" font-family="'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800">E-Commerce Retail Sales &amp; Customer Analytics</text>

    <!-- Subtitle -->
    <text x="60" y="165" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400">End-to-End Data Pipeline, Pricing Dynamics &amp; Operational SLAs (12K+ Transactions)</text>

    <!-- KPI Cards Container -->
    <!-- Card 1 -->
    <rect x="60" y="205" width="220" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="80" y="240" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">$1.39M</text>
    <text x="80" y="265" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Gross Revenue</text>

    <!-- Card 2 -->
    <rect x="300" y="205" width="220" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="320" y="240" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">12,000+</text>
    <text x="320" y="265" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Total Orders</text>

    <!-- Card 3 -->
    <rect x="540" y="205" width="220" height="80" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="560" y="240" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800">88.47%</text>
    <text x="560" y="265" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Repeat Customer Rate</text>

    <!-- Footer Section -->
    <line x1="60" y1="330" x2="1140" y2="330" stroke="#334155" stroke-width="1"/>

    <!-- Author Info -->
    <text x="60" y="362" fill="#F8FAFC" font-family="'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600">Created by Mohammad Shadab</text>
    <text x="310" y="362" fill="#64748B" font-family="'Segoe UI', Roboto, sans-serif" font-size="16">|</text>
    <text x="330" y="362" fill="#38BDF8" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">Data Analyst Portfolio Project</text>

    <!-- Tech Stack Right -->
    <text x="1140" y="362" fill="#94A3B8" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="end">Python &#8226; Pandas &#8226; Seaborn &#8226; Matplotlib &#8226; EDA</text>

    <!-- Gradients Definition -->
    <defs>
      <linearGradient id="bg-gradient" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#0F172A"/>
        <stop offset="100%" stop-color="#1E293B"/>
      </linearGradient>
    </defs>
</svg>
